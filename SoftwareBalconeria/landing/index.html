<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenido a mi sitio</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f4;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
      max-width: 500px;
      text-align: center;
    }

    a {
      padding: 12px 24px;
      background-color: #42b983;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #36966e;
    }
  </style>
</head>
<body>
  <h1>Hola, soy [Tu Nombre]</h1>
  <p>Bienvenido a mi sitio web. Aquí encontrarás información sobre mis proyectos, experiencia y más. También puedes acceder directamente al sistema que he desarrollado.</p>
  <a href="/sistema/">Ir al sistema</a>
</body>
</html>

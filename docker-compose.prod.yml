version: "3.9"

services:
  # ─── Base de datos PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: balconeria_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # En producción NO exponer el puerto al exterior
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balconeria_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3001
      NODE_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_ADMIN_KEY_PATH: ./firebase-admin-key.json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./backend/firebase-admin-key.json:/app/firebase-admin-key.json:ro
    # El puerto solo lo expone nginx, no al exterior directamente

  # ─── Frontend (build estático) + Nginx ────────────────────────
  frontend:
    build:
      context: ./SoftwareBalconeria
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: balconeria_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certbot pone los certificados aquí
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    # nginx.conf se incluye en el Dockerfile del frontend

volumes:
  postgres_data:
  certbot_www:
